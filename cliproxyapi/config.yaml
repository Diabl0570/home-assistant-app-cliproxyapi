name: CLIProxyAPI
version: "8.0.10-2"
image: ghcr.io/diabl0570/home-assistant-app-cliproxyapi-{arch}
slug: cliproxyapi
description: OpenAI-compatible CLIProxyAPI server as a Home Assistant app
url: https://github.com/Diabl0570/home-assistant-app-cliproxyapi
arch:
  - amd64
startup: services
boot: auto
init: false
webui: http://[HOST]:[PORT:18317]/management.html
ports:
  8317/tcp: 8317
  18317/tcp: 18317
  18318/tcp: 18318
  8085/tcp: null
  1455/tcp: null
  54545/tcp: null
  51121/tcp: null
  11451/tcp: null
ports_description:
  8317/tcp: API and stock management panel (local network)
  18317/tcp: CPA Manager Plus panel (local network)
  18318/tcp: Read-only failed-request diagnostics, off without diagnostics_keys (local network)
  8085/tcp: Optional Gemini OAuth callback
  1455/tcp: Optional Codex OAuth callback
  54545/tcp: Optional Claude OAuth callback
  51121/tcp: Optional Antigravity OAuth callback
  11451/tcp: Optional additional upstream OAuth callback
options:
  api_keys: []
  management_password: ""
  logging: false
  routing_strategy: round-robin
  session_affinity: true
  session_affinity_ttl: 1h
  retry_other_accounts: true
  blocked_models:
    - gpt-6-sol
    - gpt-5.6-sol
    - devin/gpt-6-sol
    - devin/gpt-5-6-sol
  diagnostics_keys: []
schema:
  api_keys:
    - str
  management_password: password
  logging: bool
  routing_strategy: list(round-robin|fill-first)
  session_affinity: bool
  session_affinity_ttl: str
  retry_other_accounts: bool
  blocked_models:
    - str
  diagnostics_keys:
    - password
