name: CLIProxyAPI
version: "8.0.4-4"
image: ghcr.io/diabl0570/home-assistant-app-cliproxyapi-{arch}
slug: cliproxyapi
description: OpenAI-compatible CLIProxyAPI server as a Home Assistant app
url: https://github.com/Diabl0570/home-assistant-app-cliproxyapi
arch:
  - amd64
startup: services
boot: auto
init: false
webui: http://[HOST]:[PORT:8317]/management.html
ports:
  8317/tcp: 8317
  8085/tcp: null
  1455/tcp: null
  54545/tcp: null
  51121/tcp: null
  11451/tcp: null
ports_description:
  8317/tcp: API and management panel (local network)
  8085/tcp: Optional Gemini OAuth callback
  1455/tcp: Optional Codex OAuth callback
  54545/tcp: Optional Claude OAuth callback
  51121/tcp: Optional Antigravity OAuth callback
  11451/tcp: Optional additional upstream OAuth callback
options:
  api_keys: []
  management_password: ""
  logging: false
  routing_strategy: round-robin
  session_affinity: true
  session_affinity_ttl: 1h
  auto_switch_accounts: true
schema:
  api_keys:
    - str
  management_password: password
  logging: bool
  routing_strategy: list(round-robin|fill-first|weighted-round-robin)
  session_affinity: bool
  session_affinity_ttl: str
  auto_switch_accounts: bool
